name: Alert Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Alert action"
        required: true
        type: choice
        options:
          - disable
          - enable
        default: disable

permissions:
  id-token: write
  contents: read

jobs:
  alert-management:
    runs-on: ubuntu-latest

    steps:
      - name: Check Azure Client ID
        shell: bash
        run: |
          CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}"
          echo "Client ID ends with: ${CLIENT_ID: -4}"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show selected action
        run: |
          echo "Alert Management Pipeline"
          echo "Action: ${{ inputs.action }}"
          echo "Alert: CI-CD-Transactions-Test"
